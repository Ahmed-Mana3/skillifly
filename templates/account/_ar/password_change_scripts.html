<script>
  document.querySelectorAll('input[type="password"], input[type="text"]').forEach(el => {
    el.classList.add('sf-input');
  });

  const commonPasswords = ['password','123456','password1','qwerty','abc123','letmein','monkey','1234567890','iloveyou','admin'];

  const rules = {
    length:      val => val.length >= 8,
    notcommon:   val => !commonPasswords.includes(val.toLowerCase()),
    notnumeric:  val => /[a-zA-Z]/.test(val),
    notpersonal: val => val.length >= 4,
  };

  function updateRules(val) {
    document.querySelectorAll('.pw-rule').forEach(el => {
      const rule = el.dataset.rule;
      const iconEl = el.querySelector('.pw-icon');
      const labelEl = el.querySelector('span:last-child');
      const passed = val.length > 0 && rules[rule] && rules[rule](val);
      if (passed) {
        el.classList.add('met');
        iconEl.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="#22C55E"/><path d="M4.5 8l2.5 2.5 4.5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        labelEl.style.color = '#16A34A';
      } else {
        el.classList.remove('met');
        iconEl.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#CBD5E1" stroke-width="1.5"/></svg>';
        labelEl.style.color = '';
      }
    });
  }

  const newPwField = document.getElementById('id_password1');
  const bars = [document.getElementById('bar-1'), document.getElementById('bar-2'), document.getElementById('bar-3'), document.getElementById('bar-4')];
  const label = document.getElementById('strength-label');

  if (newPwField) {
    updateRules('');
    newPwField.addEventListener('input', function () {
      const val = newPwField.value;
      updateRules(val);

      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const colors = ['#EF4444', '#F97316', '#EAB308', '#22C55E'];
      const labels = ['ضعيفة', 'مقبولة', 'جيدة', 'قوية'];

      if (bars[0]) {
        bars.forEach((bar, i) => {
          bar.style.background = i < score ? colors[score - 1] : '#E2E8F0';
          bar.style.transition = 'background 0.3s ease';
        });
      }

      if (label) {
        if (val.length === 0) {
          label.textContent = 'اكتب كلمة مرور جديدة بالأعلى';
          label.style.color = '#94A3B8';
        } else {
          label.textContent = labels[score - 1] || 'ضعيفة';
          label.style.color = colors[score - 1];
        }
      }
    });
  }
</script>
<style>
  .pw-rule.met {
    background: #F0FDF4 !important;
    border-color: #86EFAC !important;
  }
</style>
