{% load static %}{% include "account/_ar/_warm_style.html" %}

<div class="min-h-screen flex items-center justify-center px-4 py-20 relative overflow-hidden arabic-rtl">
  <div class="warm-lights" aria-hidden="true"></div>
  <!-- Background decorations matched to English pages -->
  <div class="absolute top-1/3 left-1/4 w-72 h-72 rounded-full opacity-[0.05]" style="background: radial-gradient(circle, #10B981, transparent 70%); filter: blur(60px);"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="gradient-border rounded-3xl p-8 md:p-10 animate-fadeInUp">

      <!-- Success animation -->
      <div class="text-center mb-8">
        <a href="{% url 'arabic_landing' %}" class="inline-flex items-center gap-2 mb-6">
          <img src="{% static 'img/bird.png' %}" alt="Skillifly" class="h-9 w-9 object-contain animate-float">
          <span class="text-xl font-bold gradient-text">Skillifly</span>
        </a>

        <!-- Animated checkmark icon -->
        <div class="w-16 h-16 rounded-full mx-auto mb-5 flex items-center justify-center"
          style="background: linear-gradient(135deg, #10B981, #059669); box-shadow: 0 12px 30px -8px rgba(16,185,129,0.4);">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
          </svg>
        </div>

        <h1 class="text-2xl font-bold mb-2 text-slate-900">تم تحديث كلمة المرور!</h1>
        <p class="text-slate-500 text-sm leading-relaxed px-2">
          تم تغيير كلمة مرورك بنجاح. يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.
        </p>
      </div>

      <!-- Success callout -->
      <div class="rounded-2xl p-4 mb-6" style="background: #F0FDF4; border: 1px solid #BBF7D0;">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 text-emerald-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          <p class="text-sm text-emerald-700 font-semibold">حسابك الآن آمن باستخدام كلمة المرور الجديدة.</p>
        </div>
      </div>

      <!-- CTA -->
      <a href="{% url 'arabic_signin' %}" class="btn-primary w-full py-3.5 text-base shadow-xl shadow-blue-500/10 flex items-center justify-center gap-2">
        تسجيل الدخول إلى حسابك
        <svg class="rtl-arrow w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
        </svg>
      </a>

      <p class="text-center text-xs text-slate-500 mt-6 leading-relaxed">
        تواجه مشكلة؟ <a href="{% url 'contact' %}" class="text-blue-600 hover:text-blue-700 font-medium transition-colors">تواصل مع الدعم</a>
      </p>

    </div>
  </div>
</div>
