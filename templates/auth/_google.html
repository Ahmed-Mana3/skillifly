{% load socialaccount %}{# Google sign-in/up button + "or" divider. Must sit OUTSIDE the email form (browsers drop nested forms). Usage: with label="..." or_label="..." #}
{% if google_oauth_button_visible %}
<form action="{% provider_login_url 'google' next=next %}" method="post" data-auth-method="google">
  {% csrf_token %}
  <button type="submit" class="au-btn au-btn--google">
    <span class="au-last" data-last-for="google" hidden>{% if is_arabic_page %}آخر ما استخدمته{% else %}Last used{% endif %}</span>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M23.49 12.27c0-.82-.07-1.43-.2-2.07H12.24v3.99h6.46c-.13 1.01-.83 2.53-2.38 3.55v2.6h3.72c2.18-2.02 3.45-4.99 3.45-8.07z" fill="#4285F4"/>
      <path d="M12.24 24c3.24 0 5.96-1.06 7.95-2.89l-3.72-2.6c-1 .7-2.35 1.19-4.23 1.19-3.17 0-5.86-2.08-6.82-4.96H1.58v2.69C3.56 21.44 7.7 24 12.24 24z" fill="#34A853"/>
      <path d="M5.42 14.74a7.7 7.7 0 0 1-.4-2.46c0-.86.14-1.7.4-2.46V7.13H1.58A12 12 0 0 0 0 12.28c0 1.94.46 3.78 1.58 5.15l3.84-2.69z" fill="#FBBC05"/>
      <path d="M12.24 4.58c2.3 0 3.85.99 4.73 1.82l3.45-3.36C18.2 1.06 15.48 0 12.24 0 7.7 0 3.56 2.56 1.58 6.87l3.84 2.69c.96-2.88 3.65-4.98 6.82-4.98z" fill="#EA4335"/>
    </svg>
    <span>{{ label }}</span>
  </button>
</form>
<div class="au-or" role="separator">{{ or_label }}</div>
{% endif %}
