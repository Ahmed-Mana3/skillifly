{# Flash messages inside the auth card (the base layout's own messages block is switched off on these pages). #}
{% for m in messages %}
<div class="au-alert{% if m.tags != 'error' %} au-alert--ok{% endif %}" role="{% if m.tags == 'error' %}alert{% else %}status{% endif %}">
  {% if m.tags == 'error' %}<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 10-2 0v4a1 1 0 102 0V6zm-1 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>
  {% else %}<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>{% endif %}
  <div>{{ m }}</div>
</div>
{% endfor %}
