{% comment %}
Shared stylesheet for the client dashboard (EN + AR).
Deliberately minimal: a client has exactly two things to do — hire a
talent, or manage reviews — so the page is a header plus two cards.
{% endcomment %}
<style>
  .cdash {
    --cd-ink: #0F172A;
    --cd-muted: #475569;
    --cd-faint: #64748B;
    --cd-hair: rgba(15, 23, 42, 0.09);
    --cd-purple: #7C3AED;
    --cd-purple-deep: #6D28D9;
    --cd-amber: #F59E0B;
    --cd-shell: 1080px;
  }
  .cdash {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--cd-ink);
    background: #fff;
    min-height: 100vh;
    padding-bottom: 96px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .cdash h1, .cdash h2, .cdash h3 { font-family: 'Syne', sans-serif; letter-spacing: -0.01em; }

  .cd-wrap { max-width: var(--cd-shell); margin: 0 auto; padding-inline: 24px; }
  .cdash a:focus-visible { outline: 3px solid rgba(124, 58, 237, 0.45); outline-offset: 3px; }
  .cdash .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ─────────────────────────  Header  ───────────────────────── */
  .cd-top { padding: 64px 0 44px; text-align: center; }
  .cd-eyebrow {
    margin: 0 0 14px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #1E40AF;
  }
  .cd-top h1 {
    margin: 0;
    font-size: clamp(2rem, 4.5vw, 3rem);
    font-weight: 700;
    line-height: 1.1;
    color: #000;
  }
  .cd-top h1 img { width: 40px; height: 40px; object-fit: contain; vertical-align: middle; }
  .cd-lede {
    margin: 16px auto 0;
    max-width: 52ch;
    font-size: 1.0625rem;
    line-height: 1.7;
    color: var(--cd-muted);
  }

  /* ─────────────────────────  The two options  ───────────────────────── */
  .cd-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px;
    padding: 0; margin: 0;
    list-style: none;
  }
  @media (max-width: 860px) { .cd-options { grid-template-columns: 1fr; } }

  .cd-option {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #fff;
    border: 1px solid rgba(124, 58, 237, 0.14);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 30px -12px rgba(15, 23, 42, 0.12);
    transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }
  .cd-option:hover {
    border-color: rgba(124, 58, 237, 0.38);
    box-shadow: 0 24px 44px -22px rgba(15, 23, 42, 0.24);
    transform: translateY(-4px);
  }

  /* Coloured banner that names the option */
  .cd-option-banner {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px;
    color: #fff;
  }
  .cd-option--hire .cd-option-banner {
    background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%);
  }
  .cd-option--reviews .cd-option-banner {
    background: linear-gradient(135deg, #0F172A 0%, #334155 100%);
  }
  .cd-option-icon {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.24);
  }
  .cd-option-icon svg { width: 22px; height: 22px; }
  .cd-option-banner h2 {
    margin: 0;
    font-size: 1.375rem;
    font-weight: 700;
    line-height: 1.25;
    color: #fff;
  }
  .cd-option-banner p {
    margin: 4px 0 0;
    font-size: 0.8125rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.72);
  }

  .cd-option-body {
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 16px;
    padding: 24px;
  }
  .cd-option-desc { margin: 0; font-size: 0.9375rem; line-height: 1.7; color: var(--cd-muted); }

  /* Small stat strip */
  .cd-stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .cd-stat {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    padding: 8px 13px;
    background: #F8FAFC;
    border: 1px solid var(--cd-hair);
    border-radius: 999px;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--cd-muted);
  }
  .cd-stat b {
    font-family: 'Syne', sans-serif;
    font-size: 0.9375rem;
    font-weight: 800;
    color: var(--cd-ink);
  }
  .cd-stat--star b { color: var(--cd-amber); }

  /* Top-rated picks inside the hire option */
  .cd-picks { display: grid; gap: 10px; }
  .cd-pick {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: #F8FAFC;
    border: 1px solid var(--cd-hair);
    border-radius: 14px;
    text-decoration: none;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .cd-pick:hover { background: #fff; border-color: rgba(124, 58, 237, 0.35); }
  .cd-pick-media {
    flex: 0 0 auto;
    width: 74px;
    height: 50px;
    border-radius: 10px;
    overflow: hidden;
    background: #E2E8F0;
    display: grid;
    place-items: center;
  }
  .cd-pick-media img { width: 100%; height: 100%; object-fit: cover; }
  .cd-pick-media b {
    font-family: 'Syne', sans-serif;
    font-size: 0.9375rem;
    font-weight: 800;
    color: #94A3B8;
  }
  .cd-pick-text { min-width: 0; flex: 1 1 auto; }
  .cd-pick-name {
    display: block;
    font-family: 'Syne', sans-serif;
    font-size: 0.9375rem;
    font-weight: 700;
    color: var(--cd-ink);
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cd-pick-stars { display: inline-flex; align-items: center; gap: 6px; margin-top: 3px; direction: ltr; }
  .cd-pick-stars em { font-style: normal; font-size: 0.75rem; font-weight: 600; color: var(--cd-faint); }
  .cd-stars {
    position: relative;
    display: inline-block;
    font-size: 0.8125rem;
    line-height: 1;
    letter-spacing: 2px;
    color: rgba(15, 23, 42, 0.18);
  }
  .cd-stars-fill {
    position: absolute;
    inset-block-start: 0;
    inset-inline-start: 0;
    overflow: hidden;
    white-space: nowrap;
    color: var(--cd-amber);
  }

  /* Recent reviews inside the reviews option */
  .cd-reviews { display: grid; gap: 10px; }
  .cd-review {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 13px;
    background: #F8FAFC;
    border: 1px solid var(--cd-hair);
    border-radius: 14px;
  }
  .cd-review-avatar {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #EDE9FE;
    display: grid;
    place-items: center;
    font-family: 'Syne', sans-serif;
    font-size: 0.75rem;
    font-weight: 800;
    color: var(--cd-purple-deep);
  }
  .cd-review-text { min-width: 0; flex: 1 1 auto; }
  .cd-review-text strong {
    display: block;
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--cd-ink);
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cd-review-text span {
    display: block;
    font-size: 0.75rem;
    color: var(--cd-faint);
    line-height: 1.5;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cd-empty-note {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    border: 1px dashed var(--cd-hair);
    border-radius: 14px;
    font-size: 0.875rem;
    line-height: 1.6;
    color: var(--cd-faint);
  }
  .cd-empty-note svg { width: 18px; height: 18px; flex: 0 0 auto; color: #94A3B8; }

  /* Footer CTA */
  .cd-option-foot {
    margin-top: auto;
    padding: 20px 24px 24px;
    border-top: 1px solid var(--cd-hair);
  }
  .cd-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 48px;
    padding-inline: 26px;
    border-radius: 13px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9375rem;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.2s ease, transform 0.2s ease, gap 0.2s ease;
  }
  .cd-cta svg { width: 16px; height: 16px; }
  .cd-cta--primary { background: #7C3AED; color: #fff; box-shadow: 0 12px 26px -14px rgba(124, 58, 237, 0.95); }
  .cd-cta--primary:hover { background: var(--cd-purple-deep); transform: translateY(-1px); }
  .cd-cta--dark { background: #0F172A; color: #fff; }
  .cd-cta--dark:hover { background: #1E293B; transform: translateY(-1px); }
  .cd-option:hover .cd-cta { gap: 12px; }

  @media (max-width: 640px) {
    .cdash { padding-bottom: 64px; }
    .cd-top { padding: 44px 0 32px; }
    .cd-option-banner { padding: 20px; }
    .cd-option-body { padding: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cdash *, .cdash *::before, .cdash *::after { animation: none !important; transition: none !important; }
    .cdash .cd-option:hover, .cdash .cd-cta:hover { transform: none; }
  }
</style>
