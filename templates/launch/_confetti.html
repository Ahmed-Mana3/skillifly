{# window.sfConfetti({x, y, count}): a short canvas confetti burst. No-op with reduced motion. #}
<script>
(function () {
  if (window.sfConfetti) return;
  window.sfConfetti = function (opts) {
    opts = opts || {};
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var canvas = document.createElement('canvas');
    canvas.setAttribute('aria-hidden', 'true');
    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2147483646';
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var w = window.innerWidth, h = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var colors = ['#3B82F6', '#8B5CF6', '#D946EF', '#F59E0B', '#10B981', '#F43F5E', '#22D3EE'];
    var ox = (opts.x == null ? 0.5 : opts.x) * w;
    var oy = (opts.y == null ? 0.35 : opts.y) * h;
    var parts = [];
    for (var i = 0; i < (opts.count || 150); i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 3 + Math.random() * 9;
      parts.push({
        x: ox, y: oy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 5,
        size: 6 + Math.random() * 6, rot: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 0.35,
        color: colors[i % colors.length], round: Math.random() < 0.3, age: 0, ttl: 110 + Math.random() * 70
      });
    }
    var frames = 0;
    (function tick() {
      frames++;
      ctx.clearRect(0, 0, w, h);
      var alive = 0;
      for (var j = 0; j < parts.length; j++) {
        var p = parts[j];
        if (++p.age > p.ttl) continue;
        alive++;
        p.vy += 0.26; p.vx *= 0.986; p.vy *= 0.986;
        p.x += p.vx; p.y += p.vy; p.rot += p.spin;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.age / p.ttl);
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
        else { ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * (0.4 + Math.abs(Math.cos(p.age / 7)))); }
        ctx.restore();
      }
      if (alive && frames < 420) window.requestAnimationFrame(tick); else canvas.remove();
    })();
  };
})();
</script>
