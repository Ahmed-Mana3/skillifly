            var config = {"theme":"purple","layout":"modern","orderSchemaPropertiesBy":"preserve","orderRequiredPropertiesFirst":false,"proxyUrl":"https:\/\/proxy.scalar.com","showSidebar":true,"hideModels":false,"hideDownloadButton":false,"hideTestRequestButton":false,"hideSearch":false,"darkMode":true,"hideDarkModeToggle":false,"searchHotKey":"k","metaData":{"title":"fawaterak API Reference"},"hiddenClients":[],"defaultHttpClient":{"targetId":"shell","clientKey":"curl"},"customCss":"\/*\n * Tag-only reference pages (e.g. Test cards): Scalar lays out tag description in\n * .section-columns beside an operations list. With no endpoints, the empty second\n * column still gets flex: 1. Individual API operations also use .section-columns\n * but live inside the same .tag-section-container \u2014 exclude them via .operation-details.\n *\/\n.scalar-app .tag-section-container .section-columns:not(:has(.endpoints-card)):not(:has(.operation-details)) {\n    flex-direction: column;\n    gap: 0;\n}\n\n.scalar-app .tag-section-container .section-columns:not(:has(.endpoints-card)):not(:has(.operation-details)) .section-column {\n    flex: none;\n    width: 100%;\n    max-width: 100%;\n}\n\n.scalar-app .tag-section-container .section-columns:not(:has(.endpoints-card)):not(:has(.operation-details)) .section-column:last-child {\n    display: none;\n}\n\n\/*\n * Sidebar x-tagGroups labels (e.g. \u0022| Payment integrations\u0022) \u2014 ScalarSidebarSection.\n *\/\n.scalar-app [class*=\u0022group\/sidebar-section\u0022] \u003E div[class*=\u0022font-bold\u0022] {\n    font-size: var(--scalar-font-size-3, 15px) !important;\n    line-height: 1.35 !important;\n    font-weight: var(--scalar-bold, 700) !important;\n    color: var(--scalar-color-accent) !important;\n    letter-spacing: 0.02em;\n}\n\n\/*\n * Markdown tables in operation descriptions: keep short parameter names like\n * `redirect` from wrapping into multiple lines in narrow first columns.\n *\/\n.scalar-app .markdown table th:first-child,\n.scalar-app .markdown table td:first-child {\n    min-width: 120px;\n    white-space: nowrap;\n}","withDefaultFonts":true,"defaultOpenAllTags":false,"content":{"openapi":"3.1.0","info":{"title":"Fawaterak API","version":"3.0.0","description":"Public API transactions (API v3), enables you to accept online payments through a unified and flexible integration platform.\n\nIntegration types:\n- API integration - Server to Server integration\n- Iframe integation - Host Fawaterk transaction link at your Website.\n- Mobile integration - Native apps via OAuth + TR APIs\n\n**Authentication overview**\n- **OAuth client credentials** \u2014 machine-to-machine (`POST \/oauth\/token` \u2192 Bearer on `\/api\/v3\/*` transaction and payment-method endpoints).\n- **Domain hash** \u2014 browser iframe without a merchant backend (`FAWATERAK-HASH-KEY` + `FAWATERAK-DOMAIN`; see **Iframe integration**)."},"servers":[{"url":"https:\/\/staging.fawaterk.com","description":"Application Staging base URL","variables":{"appUrl":{"default":"https:\/\/staging.fawaterk.com","description":"Set to your environment staging."}}},{"url":"https:\/\/app.fawaterk.com","description":"Application Live base URL","variables":{"appUrl":{"default":"https:\/\/app.fawaterk.com","description":"Set to your environment live."}}},{"url":"https:\/\/yoursite.com","description":"Your server \u2014 Fawaterak POSTs webhooks to URLs you configure in the dashboard or per-transaction `redirectionUrls`."}],"tags":[{"name":"Get started","description":"To get started you need to create a business account from here appUrl\/regsiter.\n \u003Cimg src=\u0027https:\/\/staging.fawaterk.com\/doc\/register.png\u0027 width=\u0027100%\u0027\/\u003E \n\nTo complete your integrations setup, login to your created account \u003E Integrations tab:\n\n- OAuth client credentials (API) - to create client id and secret.\n\n- Integrations - to setup your redirection URLs \/ Iframe domains \/ Webhook URLs (paid, failed, cancel, refund)."},{"name":"Auth token","description":"Obtain a Bearer access token using OAuth **client credentials**. Use the token on all `\/api\/v3\/*` endpoints that require OAuth (transactions, refunds, e-invoicing)."},{"name":"Transactions overview","x-displayName":"Overview","description":"Transactions let you process a single **one-time payment** with a clear lifecycle status: **success**, **fail**, or **pending**.\n\nThere are two ways to create a transaction:\n\n**1. Hosted checkout (redirection link)** \u2014 Do **not** send `payment_method_id`. The API creates a transaction link and returns a hosted checkout URL in `data.url`. Redirect the customer to it (or open it inside an iframe \/ WebView); the customer selects a payment method and pays on the Fawaterak-hosted page. This is a single payment attempt \u2014 the link is not meant to be reused for multiple tries.\n\n**2. Direct payment** \u2014 Send `payment_method_id` (from `GET \/api\/v3\/getTrPaymentmethods`). The API initiates payment immediately with that specific method and returns the provider response in `data.payment_data` (for example a Fawry reference code, a Meeza wallet request, or a card 3-D Secure redirect).\n\n| Mode | Send `payment_method_id`? | Use from response |\n|------|---------------------------|-------------------|\n| Hosted checkout | No | `data.url` |\n| Direct payment | Yes | `data.payment_data` |\n\nAuthenticate every call with `Authorization: Bearer {access_token}` from `POST \/oauth\/token`. Always confirm the **final paid status from your webhook**, not only from the customer redirect."},{"name":"API integration","description":"This is server to server APIs integtatoins enables you to list active payment methods \/ create trasaction link \/ get transaction data. Requires OAuth client credentials."},{"name":"Iframe integration","description":"Embed Fawaterak checkout on your website with **fawaterkPlugin.js** (`\/fawaterkPlugin\/fawaterkPlugin.js`). Both flows open the same hosted checkout page (`\/transactions\/{intent_key}`) inside an iframe.\n\n---\n\n## Integration types\n\n| You have | Approach | Auth |\n|----------|----------|------|\n| **Frontend** \u2014 HTML\/JavaScript only, no server | Plugin creates the session from the browser via domain hash | Domain HMAC (`FAWATERAK-HASH-KEY` + `FAWATERAK-DOMAIN`) |\n| **Backend** \u2014 a server that can call APIs securely (recommended) | Server creates the checkout session; the page only receives a checkout URL | OAuth client credentials |\n\n**Prerequisite (both types):** Register your site domain under **Integrations \u2192 iframe domains** in the vendor dashboard.\n\n---\n\n## Frontend integration (browser-only)\n\nUse when you cannot call Fawaterak APIs from a server. **Do not embed your API key in the page** \u2014 use a domain-bound hash key instead.\n\n1. **Register your domain** \u2014 Vendor dashboard \u2192 **Integrations \u2192 iframe domains** (e.g. `https:\/\/shop.example.com`).\n2. **Compute the hash key** \u2014 Prefer a small server script or build step (not hand-calculated in production):\n\n```\nProviderKey  = \u0022FAWATERAK.{your_vendor_id}\u0022\nStringToSign = \u0022Domain={your_domain}\u0026ProviderKey={ProviderKey}\u0022 \nhashKey      = HMAC-SHA256(StringToSign, your_vendor_api_key)\n```\n\nSend `hashKey` as header `FAWATERAK-HASH-KEY` and your domain as `FAWATERAK-DOMAIN`. The hash only works from registered domains.\n\n3. **Add the plugin** \u2014 Pass `hashKey` and `requestBody` (same cart fields as `createTransaction`). The plugin initializes the session automatically, then loads checkout in the iframe:\n\n```html\n\u003Cdiv id=\u0022fawaterkDivId\u0022\u003E\u003C\/div\u003E\n\u003Cscript src=\u0022https:\/\/app.fawaterk.com\/fawaterkPlugin\/fawaterkPlugin.js\u0022\u003E\u003C\/script\u003E\n\u003Cscript\u003E\n  fawaterkCheckoutV2({\n    envType: \u0022live\u0022,\n    hashKey: \u0022YOUR_DOMAIN_HASH_KEY\u0022,\n    requestBody: {\n      \u0022cartTotal\u0022: \u0022150.00\u0022,\n      \u0022currency\u0022: \u0022EGP\u0022,\n      \u0022list_style\u0022: \u0022h\u0022,\n      \u0022customer\u0022: {\n        \u0022first_name\u0022: \u0022Ahmed\u0022,\n        \u0022last_name\u0022: \u0022Ali\u0022,\n        \u0022email\u0022: \u0022ahmed@example.com\u0022,\n        \u0022phone\u0022: \u002201000000000\u0022\n      },\n      \u0022cartItems\u0022: [\n        { \u0022name\u0022: \u0022Product A\u0022, \u0022price\u0022: \u0022150.00\u0022, \u0022quantity\u0022: \u00221\u0022 }\n      ],\n      \u0022redirectionUrls\u0022: {\n        \u0022successUrl\u0022: \u0022https:\/\/yoursite.com\/success\u0022,\n        \u0022failUrl\u0022: \u0022https:\/\/yoursite.com\/fail\u0022,\n        \u0022webhookUrl\u0022: \u0022https:\/\/yoursite.com\/webhooks\/fawaterak_json\u0022\n      }\n    }\n  });\n\u003C\/script\u003E\n```\n\n`list_style` controls payment-method layout on the hosted checkout page: `\u0022h\u0022` (default) horizontal, `\u0022v\u0022` vertical.\n\n**Frontend limitations:** A user could change `cartTotal` in the browser before payment. Always verify the paid amount in your **webhook** and compare it to your order total.\n\n---\n\n## Backend integration\n\nYour server creates the payment session. The customer\u0027s browser never receives OAuth credentials or your API key.\n\n1. **Get OAuth credentials** \u2014 Vendor dashboard \u2192 **Integrations \u2192 OAuth client credentials**. Create a client and note the client ID, client secret, and token URL (`POST \/oauth\/token`).\n2. **Create a payment session (server-side)** \u2014 Obtain an access token (client credentials grant), then call `POST \/api\/v3\/createTransaction` with `Authorization: Bearer {access_token}` and your cart JSON. Include `list_style` when you want a vertical payment-method list (`\u0022v\u0022`; default is `\u0022h\u0022`). Use `data.url` (or `data.short_url`) from the response as the checkout address.\n\nExample request body:\n\n```json\n{\n  \u0022cartTotal\u0022: 150.00,\n  \u0022currency\u0022: \u0022EGP\u0022,\n  \u0022list_style\u0022: \u0022h\u0022,\n  \u0022customer\u0022: {\n    \u0022first_name\u0022: \u0022Ahmed\u0022,\n    \u0022last_name\u0022: \u0022Ali\u0022,\n    \u0022email\u0022: \u0022ahmed@example.com\u0022,\n    \u0022phone\u0022: \u002201000000000\u0022\n  },\n  \u0022cartItems\u0022: [\n    { \u0022name\u0022: \u0022Product A\u0022, \u0022price\u0022: \u0022150.00\u0022, \u0022quantity\u0022: \u00221\u0022 }\n  ],\n  \u0022redirectionUrls\u0022: {\n    \u0022successUrl\u0022: \u0022https:\/\/yoursite.com\/success\u0022,\n    \u0022failUrl\u0022: \u0022https:\/\/yoursite.com\/fail\u0022,\n    \u0022webhookUrl\u0022: \u0022https:\/\/yoursite.com\/webhooks\/fawaterak_json\u0022\n  }\n}\n```\n\n3. **Add the plugin to your page** \u2014 Render a fresh `intentUrl` per order from your server:\n\n```html\n\u003Cdiv id=\u0022fawaterkDivId\u0022\u003E\u003C\/div\u003E\n\u003Cscript src=\u0022https:\/\/app.fawaterk.com\/fawaterkPlugin\/fawaterkPlugin.js\u0022\u003E\u003C\/script\u003E\n\u003Cscript\u003E\n  fawaterkCheckoutV2({\n    envType: \u0022live\u0022,\n    intentUrl: \u0022CHECKOUT_URL_FROM_YOUR_SERVER\u0022\n  });\n\u003C\/script\u003E\n```\n\nDo not hard-code one checkout link for all orders unless the amount is fixed.\n\n---\n\n## After payment\n\nConfigure **success**, **fail**, and **webhook** URLs (dashboard and\/or `redirectionUrls` on each transaction). Mark orders as paid from **webhooks** \u2014 do not rely on the customer returning to the success page alone. See **Webhooks** for payload format, verification, and handling.\n\n| envType | Use |\n|---------|-----|\n| `live` | Production |\n| `test` | Staging \/ sandbox |"},{"name":"Tokenization and recurring","description":"Tokenization allows you to store card payment details in exchange for a token. The token replaces raw card data in later payment requests, so you can charge the saved card for tokenized or recurring payments without asking for the card details again.\n\n---\n\n## How it works\n\n1. Call `POST \/api\/v2\/createCardTokenScreen` to generate a Fawaterak-hosted card collection URL. Open the URL in an iframe or redirect the customer to it.\n2. After the customer saves the card, Fawaterak creates the token and sends it to your tokenization webhook.\n3. Use the returned `customerCardToken` \/ token later with `POST \/api\/v2\/createTokenizationPayRequest`.\n\n## Payment types\n\n- **Tokenization payment** \u2014 send `tokenAction: \u0022tokenization\u0022`; response contains `redirectTo` for the 3DS\/authentication flow.\n- **Recurring payment** \u2014 do **not** send `tokenAction`; response contains `transaction_id` after successful processing.\n\nThe generated card screen link expires after about **10 minutes**. If the screen expires or saving the card fails, the link cannot be reused.\n\n---\n\n## Created token webhook\n\nWhen a token is created, your webhook receives data similar to:\n\n```json\n{\n  \u0022customerUniqueId\u0022: \u0022222111333\u0022,\n  \u0022customerCard\u0022: \u0022512345xxxxxx0008\u0022,\n  \u0022customerCardToken\u0022: \u00229731673377207107\u0022,\n  \u0022hashKey\u0022: \u0022f59665d4077...ea2\u0022,\n  \u0022cardBrand\u0022: \u0022MASTERCARD\u0022,\n  \u0022cardTokenUniqueId\u0022: \u00222345\u0022\n}\n```\n\nValidate `hashKey` with HMAC SHA256 using your vendor API key:\n\n```php\n$queryParam = \u0022customerUniqueId=XYZ\u0026customerCardToken=XYZ\u0022;\n$hash = hash_hmac(\u0027sha256\u0027, $queryParam, \u0027FAWATERAK_VENDOR_KEY\u0027, false);\n```\n\nThese are legacy v2 endpoints protected by `ValidateVendorToken`. Send `Authorization: Bearer {vendor_api_key}` and `Content-Type: application\/json`."},{"name":"Webhooks","description":"Fawaterak sends **server-to-server POST** notifications to **your** endpoints. These are not Fawaterak API routes \u2014 implement the handlers on your server and register the URLs in the vendor dashboard (**Integrations**) or per transaction via `redirectionUrls`.\n\n| Webhook | When | Configure URL |\n|---------|------|----------------|\n| **Paid \/ pending** | Payment succeeds or is pending (Fawry, Aman, \u2026) | `webhookUrl` (per transaction) or dashboard **Webhook** |\n| **Failed** | Card\/gateway payment fails | Dashboard **Failed webhook** |\n| **Cancel** | Reference expires or is canceled (Aman, Masary, Meeza, \u2026) | Dashboard **Cancellation webhook** |\n| **Refund** | Refund request is approved | Dashboard **Refund webhook** |\n\nUse **`_json`** in the URL path for **paid** and **failed** webhooks to receive `application\/json`; otherwise the body is `application\/x-www-form-urlencoded`. **Cancel** and **refund** webhooks are always JSON.\n\nSee the **POST** operations below for request and response examples. Verify `transactionHashKey` on paid webhooks; verify `hashKey` on failed and cancel webhooks."},{"name":"E-Commerce Plugins","description":"We provide multiple ready-made plugins to accept Fawaterak payments on popular e-commerce platforms.\n\n---\n\n## Plugins\n\n1. **WooCommerce** \u2014 [Download the plugin](https:\/\/wordpress.org\/plugins\/fawaterk-for-woocommerce\/)\n2. **ExpandCart** \u2014 Through our executive partnership with ExpandCart you can create your own store and accept online payments through **Expand Pay**, powered by Fawaterak.\n3. **OpenCart** \u2014 Download from the official OpenCart marketplace: [click here](https:\/\/www.opencart.com\/index.php?route=marketplace\/extension\/info\u0026extension_id=43750\u0026filter_search=fawaterk\u0026filter_category_id=3)\n4. **Shopify (redirect \u2014 all payment methods)** \u2014 Log in to **Shopify** and **Fawaterak** in separate tabs, then install: [click here](https:\/\/apps.shopify.com\/fawaterak)\n5. **Shopify (embedded card payment only)** \u2014 Log in to **Shopify** and **Fawaterak** in separate tabs, then install: [click here](https:\/\/apps.shopify.com\/fawaterak-credit-card)\n6. **WHMCS** \u2014 [Download the plugin](https:\/\/drive.google.com\/drive\/folders\/111-ZMLJ3LxFMkusaKkXga475E2fUYtOF?usp=sharing)\n7. **CS-Cart** \u2014 [Download the plugin](https:\/\/drive.google.com\/drive\/folders\/1BCGhzsrMbrMpWB4XY7t0gGniuoy7bj62?usp=sharing)\n8. **Magento** \u2014 [Download the plugin](https:\/\/drive.google.com\/drive\/folders\/1VhjQfDZ3WbjMZjX8NO4HYQAfEyLLlhOv?usp=sharing)\n\n---\n\n## Important note (Cloudflare)\n\nIf you use **Cloudflare** with the WooCommerce plugin, add a **path-based WAF skip rule** so Fawaterak webhooks are not blocked:\n\n**Security \u2192 WAF \u2192 Custom Rules**\n\n| Setting | Value |\n|---------|-------|\n| **IF** URI Path equals | `\/wc-api\/fawaterak_webhook_json` |\n| **THEN** Skip | Browser Integrity Check, Bot Fight Mode, JS Challenge |"},{"name":"Mobile integrations","description":"Easy integration with your **mobile app** (React Native, Flutter, Kotlin, Java, Swift) using **API v3** and **TR** (cache-based transactions).\n\n---\n\n## Overview\n\nThe mobile flow has two steps:\n\n| Step | Endpoint | Purpose |\n|------|----------|--------|\n| **1** | `GET \/api\/v3\/getTrPaymentmethods` | List enabled payment methods for your account |\n| **2** | `POST \/api\/v3\/createTransaction` | Create a TR intent and pay (direct-dispatch or hosted link) |\n\n---\n\n## Authentication\n\nUse **OAuth client credentials** (not the legacy vendor API key):\n\n1. Create credentials in the vendor dashboard \u2192 **Integrations \u2192 OAuth client credentials**.\n2. Call `POST \/oauth\/token` to obtain a Bearer access token.\n3. Send `Authorization: Bearer {access_token}` on all `\/api\/v3\/*` mobile calls.\n\n---\n\n## How payment methods behave\n\n| `redirect` value | Mobile handling |\n|------------------|-----------------|\n| `\u0022true\u0022` | **Link mode** \u2014 response includes `data.url`; open in a **WebView** \/ in-app browser |\n| `\u0022false\u0022` | **Direct-dispatch** \u2014 provider reference or RTP returned synchronously (Fawry, Meeza, \u2026) |\n\n**Important:** Meeza (mobile wallets) is validated with **real payments** in production. Pass `mobileWalletNumber` when required.\n\nMark orders as paid from **webhooks** (`redirectionUrls.webhookUrl`) \u2014 see **Webhooks**."},{"name":"Mobile \u2014 List payment methods","description":"**Step 1** \u2014 Retrieve payment methods assigned to your vendor account.\n\n**Endpoint:** `GET \/api\/v3\/getTrPaymentmethods`\n\nPresent the `data` array in your app UI. Each item includes `payment_method_id`, localized names, `redirect`, and `logo`.\n\n**Mobile (step 1):** Call this after `POST \/oauth\/token`. Use `payment_method_id` when calling `createTransaction`. If `redirect` is `\u0022true\u0022`, open the returned checkout `url` in a WebView; if `\u0022false\u0022`, expect a synchronous provider response from direct-dispatch.\n\n**React Native:**\n```javascript\nconst apiUrl = \u0027https:\/\/app.fawaterk.com\/api\/v3\/getTrPaymentmethods\u0027;\nconst accessToken = \u0027YOUR_OAUTH_ACCESS_TOKEN\u0027;\n\nfetch(apiUrl, {\n  method: \u0027GET\u0027,\n  headers: {\n    \u0027Content-Type\u0027: \u0027application\/json\u0027,\n    Authorization: `Bearer ${accessToken}`,\n  },\n})\n  .then((r) =\u003E r.json())\n  .then(console.log)\n  .catch(console.error);\n```\n\n**Kotlin:**\n```kotlin\nval apiUrl = \u0022https:\/\/app.fawaterk.com\/api\/v3\/getTrPaymentmethods\u0022\nval accessToken = \u0022YOUR_OAUTH_ACCESS_TOKEN\u0022\n\nval client = OkHttpClient()\nval request = Request.Builder()\n    .url(apiUrl)\n    .addHeader(\u0022Content-Type\u0022, \u0022application\/json\u0022)\n    .addHeader(\u0022Authorization\u0022, \u0022Bearer $accessToken\u0022)\n    .build()\n\nclient.newCall(request).execute().use { response -\u003E\n    if (response.isSuccessful) {\n        println(response.body?.string())\n    } else {\n        println(\u0022Request failed: ${response.code}\u0022)\n    }\n}\n```\n\n**Java:**\n```java\nString apiUrl = \u0022https:\/\/app.fawaterk.com\/api\/v3\/getTrPaymentmethods\u0022;\nString accessToken = \u0022YOUR_OAUTH_ACCESS_TOKEN\u0022;\n\nOkHttpClient client = new OkHttpClient();\nRequest request = new Request.Builder()\n    .url(apiUrl)\n    .addHeader(\u0022Content-Type\u0022, \u0022application\/json\u0022)\n    .addHeader(\u0022Authorization\u0022, \u0022Bearer \u0022 + accessToken)\n    .build();\n\ntry (Response response = client.newCall(request).execute()) {\n    if (response.isSuccessful() \u0026\u0026 response.body() != null) {\n        System.out.println(response.body().string());\n    } else {\n        System.out.println(\u0022Request failed: \u0022 + response.code());\n    }\n}\n```\n\n**Swift:**\n```swift\nlet apiUrl = \u0022https:\/\/app.fawaterk.com\/api\/v3\/getTrPaymentmethods\u0022\nlet accessToken = \u0022YOUR_OAUTH_ACCESS_TOKEN\u0022\n\nif let url = URL(string: apiUrl) {\n    var request = URLRequest(url: url)\n    request.setValue(\u0022application\/json\u0022, forHTTPHeaderField: \u0022Content-Type\u0022)\n    request.setValue(\u0022Bearer \\(accessToken)\u0022, forHTTPHeaderField: \u0022Authorization\u0022)\n\n    URLSession.shared.dataTask(with: request) { data, _, error in\n        if let error = error {\n            print(\u0022Error: \\(error)\u0022)\n            return\n        }\n        if let data = data, let body = String(data: data, encoding: .utf8) {\n            print(body)\n        }\n    }.resume()\n}\n```\n\n**Flutter:**\n```dart\nimport \u0027dart:convert\u0027;\nimport \u0027package:http\/http.dart\u0027 as http;\n\nFuture\u003Cvoid\u003E fetchPaymentMethods() async {\n  const apiUrl = \u0027https:\/\/app.fawaterk.com\/api\/v3\/getTrPaymentmethods\u0027;\n  const accessToken = \u0027YOUR_OAUTH_ACCESS_TOKEN\u0027;\n\n  final response = await http.get(\n    Uri.parse(apiUrl),\n    headers: {\n      \u0027Content-Type\u0027: \u0027application\/json\u0027,\n      \u0027Authorization\u0027: \u0027Bearer $accessToken\u0027,\n    },\n  );\n  print(json.encode(json.decode(response.body)));\n}\n```"},{"name":"Mobile \u2014 Process transaction","description":"**Step 2** \u2014 Create a **TR** transaction and initiate payment on the selected method.\n\n**Endpoint:** `POST \/api\/v3\/createTransaction`\n\nInclude `payment_method_id` from step 1 plus cart\/customer fields. Response shape depends on the method:\n\n- **Card \/ redirect methods** \u2014 hosted checkout URL in `data.url` (open in WebView)\n- **Fawry** \u2014 direct-dispatch reference code\n- **Meeza** \u2014 wallet RTP \/ reference in provider response\n\nUse `intent_key` from the response to correlate with webhooks and `POST \/api\/v3\/getTransactionData`.\n\n**Mobile (step 2):** Include `payment_method_id` from step 1.\n\n| Mode | When | Mobile action |\n|------|------|---------------|\n| **Link** | `redirect` = `\u0022true\u0022` (e.g. Visa\/Mastercard) | Open `data.url` in WebView |\n| **Direct-dispatch** | `redirect` = `\u0022false\u0022` (e.g. Fawry, Meeza) | Show reference \/ handle RTP from provider body |\n\n**React Native:**\n```javascript\nconst API_URL = \u0027https:\/\/app.fawaterk.com\/api\/v3\/createTransaction\u0027;\nconst accessToken = \u0027YOUR_OAUTH_ACCESS_TOKEN\u0027;\nconst PAYMENT_ID = 4; \/\/ from getTrPaymentmethods\n\nfetch(API_URL, {\n  method: \u0027POST\u0027,\n  headers: {\n    Authorization: `Bearer ${accessToken}`,\n    \u0027Content-Type\u0027: \u0027application\/json\u0027,\n  },\n  body: JSON.stringify({\n    payment_method_id: PAYMENT_ID,\n    cartTotal: \u0027100\u0027,\n    currency: \u0027EGP\u0027,\n    customer: {\n      first_name: \u0027Ahmed\u0027,\n      last_name: \u0027Ali\u0027,\n      email: \u0027ahmed@example.com\u0027,\n      phone: \u002701000000000\u0027,\n      address: \u0027Cairo\u0027,\n    },\n    redirectionUrls: {\n      successUrl: \u0027https:\/\/yoursite.com\/success\u0027,\n      failUrl: \u0027https:\/\/yoursite.com\/fail\u0027,\n      pendingUrl: \u0027https:\/\/yoursite.com\/pending\u0027,\n      webhookUrl: \u0027https:\/\/yoursite.com\/webhooks\/fawaterak_json\u0027,\n    },\n    cartItems: [{ name: \u0027Order total\u0027, price: \u0027100\u0027, quantity: \u00271\u0027 }],\n  }),\n})\n  .then((r) =\u003E r.json())\n  .then(console.log)\n  .catch(console.error);\n```\n\n**Kotlin:**\n```kotlin\nval apiUrl = \u0022https:\/\/app.fawaterk.com\/api\/v3\/createTransaction\u0022\nval accessToken = \u0022YOUR_OAUTH_ACCESS_TOKEN\u0022\nval payment_method_id = 4\n\nval requestData = \u0022\u0022\u0022\n{\u0022payment_method_id\u0022:$payment_method_id,\u0022cartTotal\u0022:\u0022100\u0022,\u0022currency\u0022:\u0022EGP\u0022,\n\u0022customer\u0022:{\u0022first_name\u0022:\u0022Ahmed\u0022,\u0022last_name\u0022:\u0022Ali\u0022,\u0022email\u0022:\u0022ahmed@example.com\u0022,\u0022phone\u0022:\u002201000000000\u0022,\u0022address\u0022:\u0022Cairo\u0022},\n\u0022redirectionUrls\u0022:{\u0022successUrl\u0022:\u0022https:\/\/yoursite.com\/success\u0022,\u0022failUrl\u0022:\u0022https:\/\/yoursite.com\/fail\u0022,\u0022pendingUrl\u0022:\u0022https:\/\/yoursite.com\/pending\u0022,\u0022webhookUrl\u0022:\u0022https:\/\/yoursite.com\/webhooks\/fawaterak_json\u0022},\n\u0022cartItems\u0022:[{\u0022name\u0022:\u0022Order total\u0022,\u0022price\u0022:\u0022100\u0022,\u0022quantity\u0022:\u00221\u0022}]}\n\u0022\u0022\u0022.trimIndent()\n\nval client = OkHttpClient()\nval body = requestData.toRequestBody(\u0022application\/json\u0022.toMediaType())\nval request = Request.Builder()\n    .url(apiUrl)\n    .addHeader(\u0022Authorization\u0022, \u0022Bearer $accessToken\u0022)\n    .addHeader(\u0022Content-Type\u0022, \u0022application\/json\u0022)\n    .post(body)\n    .build()\n\nclient.newCall(request).execute().use { response -\u003E\n    println(if (response.isSuccessful) response.body?.string() else \u0022Failed: ${response.code}\u0022)\n}\n```\n\n**Java:**\n```java\nString apiUrl = \u0022https:\/\/app.fawaterk.com\/api\/v3\/createTransaction\u0022;\nString accessToken = \u0022YOUR_OAUTH_ACCESS_TOKEN\u0022;\nint payment_method_id = 4;\n\nString requestData = \u0022{\\\u0022payment_method_id\\\u0022:\u0022 + payment_method_id\n    + \u0022,\\\u0022cartTotal\\\u0022:\\\u0022100\\\u0022,\\\u0022currency\\\u0022:\\\u0022EGP\\\u0022,\u0022\n    + \u0022\\\u0022customer\\\u0022:{\\\u0022first_name\\\u0022:\\\u0022Ahmed\\\u0022,\\\u0022last_name\\\u0022:\\\u0022Ali\\\u0022,\u0022\n    + \u0022\\\u0022email\\\u0022:\\\u0022ahmed@example.com\\\u0022,\\\u0022phone\\\u0022:\\\u002201000000000\\\u0022,\\\u0022address\\\u0022:\\\u0022Cairo\\\u0022},\u0022\n    + \u0022\\\u0022redirectionUrls\\\u0022:{\\\u0022successUrl\\\u0022:\\\u0022https:\/\/yoursite.com\/success\\\u0022,\u0022\n    + \u0022\\\u0022failUrl\\\u0022:\\\u0022https:\/\/yoursite.com\/fail\\\u0022,\\\u0022pendingUrl\\\u0022:\\\u0022https:\/\/yoursite.com\/pending\\\u0022,\u0022\n    + \u0022\\\u0022webhookUrl\\\u0022:\\\u0022https:\/\/yoursite.com\/webhooks\/fawaterak_json\\\u0022},\u0022\n    + \u0022\\\u0022cartItems\\\u0022:[{\\\u0022name\\\u0022:\\\u0022Order total\\\u0022,\\\u0022price\\\u0022:\\\u0022100\\\u0022,\\\u0022quantity\\\u0022:\\\u00221\\\u0022}]}\u0022;\n\nOkHttpClient client = new OkHttpClient();\nRequestBody body = RequestBody.create(requestData, MediaType.get(\u0022application\/json\u0022));\nRequest request = new Request.Builder()\n    .url(apiUrl)\n    .addHeader(\u0022Authorization\u0022, \u0022Bearer \u0022 + accessToken)\n    .addHeader(\u0022Content-Type\u0022, \u0022application\/json\u0022)\n    .post(body)\n    .build();\n\ntry (Response response = client.newCall(request).execute()) {\n    if (response.body() != null) {\n        System.out.println(response.body().string());\n    }\n}\n```\n\n**Swift:**\n```swift\nlet apiUrl = \u0022https:\/\/app.fawaterk.com\/api\/v3\/createTransaction\u0022\nlet accessToken = \u0022YOUR_OAUTH_ACCESS_TOKEN\u0022\nlet payment_method_id = 4\n\nlet requestData = \u0022\u0022\u0022\n{\u0022payment_method_id\u0022:\\(payment_method_id),\u0022cartTotal\u0022:\u0022100\u0022,\u0022currency\u0022:\u0022EGP\u0022,\n\u0022customer\u0022:{\u0022first_name\u0022:\u0022Ahmed\u0022,\u0022last_name\u0022:\u0022Ali\u0022,\u0022email\u0022:\u0022ahmed@example.com\u0022,\u0022phone\u0022:\u002201000000000\u0022,\u0022address\u0022:\u0022Cairo\u0022},\n\u0022redirectionUrls\u0022:{\u0022successUrl\u0022:\u0022https:\/\/yoursite.com\/success\u0022,\u0022failUrl\u0022:\u0022https:\/\/yoursite.com\/fail\u0022,\u0022pendingUrl\u0022:\u0022https:\/\/yoursite.com\/pending\u0022,\u0022webhookUrl\u0022:\u0022https:\/\/yoursite.com\/webhooks\/fawaterak_json\u0022},\n\u0022cartItems\u0022:[{\u0022name\u0022:\u0022Order total\u0022,\u0022price\u0022:\u0022100\u0022,\u0022quantity\u0022:\u00221\u0022}]}\n\u0022\u0022\u0022\n\nif let url = URL(string: apiUrl) {\n    var request = URLRequest(url: url)\n    request.httpMethod = \u0022POST\u0022\n    request.setValue(\u0022application\/json\u0022, forHTTPHeaderField: \u0022Content-Type\u0022)\n    request.setValue(\u0022Bearer \\(accessToken)\u0022, forHTTPHeaderField: \u0022Authorization\u0022)\n    request.httpBody = requestData.data(using: .utf8)\n\n    URLSession.shared.dataTask(with: request) { data, _, error in\n        if let data = data, let body = String(data: data, encoding: .utf8) {\n            print(body)\n        }\n    }.resume()\n}\n```\n\n**Flutter:**\n```dart\nimport \u0027dart:convert\u0027;\nimport \u0027package:http\/http.dart\u0027 as http;\n\nFuture\u003Cvoid\u003E createTransaction() async {\n  const apiUrl = \u0027https:\/\/app.fawaterk.com\/api\/v3\/createTransaction\u0027;\n  const accessToken = \u0027YOUR_OAUTH_ACCESS_TOKEN\u0027;\n  const payment_method_id = 4;\n\n  final requestData = {\n    \u0027payment_method_id\u0027: payment_method_id,\n    \u0027cartTotal\u0027: \u0027100\u0027,\n    \u0027currency\u0027: \u0027EGP\u0027,\n    \u0027customer\u0027: {\n      \u0027first_name\u0027: \u0027Ahmed\u0027,\n      \u0027last_name\u0027: \u0027Ali\u0027,\n      \u0027email\u0027: \u0027ahmed@example.com\u0027,\n      \u0027phone\u0027: \u002701000000000\u0027,\n      \u0027address\u0027: \u0027Cairo\u0027,\n    },\n    \u0027redirectionUrls\u0027: {\n      \u0027successUrl\u0027: \u0027https:\/\/yoursite.com\/success\u0027,\n      \u0027failUrl\u0027: \u0027https:\/\/yoursite.com\/fail\u0027,\n      \u0027pendingUrl\u0027: \u0027https:\/\/yoursite.com\/pending\u0027,\n      \u0027webhookUrl\u0027: \u0027https:\/\/yoursite.com\/webhooks\/fawaterak_json\u0027,\n    },\n    \u0027cartItems\u0027: [\n      {\u0027name\u0027: \u0027Order total\u0027, \u0027price\u0027: \u0027100\u0027, \u0027quantity\u0027: \u00271\u0027},\n    ],\n  };\n\n  final response = await http.post(\n    Uri.parse(apiUrl),\n    headers: {\n      \u0027Authorization\u0027: \u0027Bearer $accessToken\u0027,\n      \u0027Content-Type\u0027: \u0027application\/json\u0027,\n    },\n    body: json.encode(requestData),\n  );\n  print(json.encode(json.decode(response.body)));\n}\n```\n\n**Link mode (default):** returns hosted URLs (`\/transactions\/{intent_key}`).\n\n**Direct-dispatch:** when `payment_method_id` has `apiRedirect = \u0022false\u0022` and no `resource` \/ truthy `redirectOption`, returns provider response synchronously."},{"name":"Refund APIs","description":"Manage refund requests for paid transactions via **OAuth client credentials**.\n\n**Legacy v2:** Existing integrations may continue using `\/api\/v2\/refund\/*` with the vendor API key (`ValidateVendorToken`). Those routes are unchanged.\n\n**Flow (v3):**\n1. `POST \/api\/v3\/refund\/refundTypes` \u2014 get `refund_type` keys (`0` = invoice, `1` = payment link transaction, `2` = collection link transaction).\n2. `POST \/api\/v3\/refund\/refundReasons` \u2014 list allowed refund reasons.\n3. `POST \/api\/v3\/refund\/create` \u2014 submit a refund using `refund_type` + `refund_id` (invoice id or payment-request transaction id).\n4. `POST \/api\/v3\/refund\/index` \/ `GET \/api\/v3\/refund\/details\/{id}` \u2014 list and inspect requests.\n5. `POST \/api\/v3\/refund\/delete` \u2014 cancel a pending (non-approved) request.\n\nRequires `Authorization: Bearer {access_token}` from `POST \/oauth\/token`."},{"name":"Overview","description":"E-invoicing lets you create an invoice and share it with your customers via **email**, **SMS**, or **manually** (copy the payment link). The customer can pay the invoice at **any time within the due date** (if a due date is set), and can **try multiple payment methods** for the same invoice link until the payment succeeds.\n\nInvoices are persisted in the `invoices` table with `create_source = API.v3.EI.IN` and return a hosted payment link (`\/in\/{invoice_key}`).\n\nRequires `Authorization: Bearer {access_token}` from `POST \/oauth\/token`."},{"name":"E-invoicing","description":"Create and manage **e-invoices** via OAuth client credentials. Invoices are persisted in the `invoices` table with `create_source = API.v3.EI.IN`. Returns a hosted payment link (`\/in\/{invoice_key}`) for the customer to pay.\n\nRequires `Authorization: Bearer {access_token}` from `POST \/oauth\/token`."},{"name":"Test cards","description":"Use these **sandbox \/ test** card numbers when testing **Mastercard**, **Visa**, and **Meeza** flows on staging or in test mode.\n\n---\n\n## Cards that always return a **successful** transaction\n\n| Brand | Card number | Card holder name | Expiry date | CSV |\n|-------|-------------|------------------|-------------|-----|\n| **Mastercard** | `5123450000000008` | Fawaterak test | 12\/26 | 100 |\n| **Visa** | `4005 5500 0000 0001` | Fawaterak test | 12\/26 | 100 |\n| **Meeza** | `5078 0362 4660 0381` | Fawaterak test | 12\/26 | 100 |\n\n---\n\n## Cards that always return a **failed** transaction\n\n| Brand | Card number | Card holder name | Expiry date | CSV |\n|-------|-------------|------------------|-------------|-----|\n| **Mastercard** | `5543474002249996` | Fawaterak test | 05\/
